document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

52-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Chivo';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"7ab6221d-7c46-4531-a5d5-fe6132ff0155\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Chivo';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"df83e415-fba5-418b-be5c-4bdfb6bf5da7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Chivo';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"150c89bc-3ad6-42e4-a444-892c09d609e2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --paper: #F4F3EF;\n    --paper-line: #E3E0D9;\n    --ink: #131313;\n    --ink-soft: #5A5854;\n    --black: #131313;\n    --orange: #F0552A;\n    --purple: #A6529D;\n    --blue: #4FA3DD;\n    --lime: #D8E62F;\n    --card: #FFFFFF;\n    --error: #C0392B;\n    --radius: 10px;\n    --serif: 'Bitter', Georgia, serif;\n    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;\n    --sans: 'Chivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;\n  }\n\n  * { box-sizing: border-box; }\n\n  body {\n    margin: 0;\n    background: var(--paper);\n    color: var(--ink);\n    font-family: var(--sans);\n    min-height: 100vh;\n    padding: 0 0 80px;\n  }\n\n  header {\n    padding: 40px 24px 28px;\n    max-width: 760px;\n    margin: 0 auto;\n  }\n\n  .lockup {\n    display: flex;\n    align-items: center;\n    gap: 16px;\n    margin-bottom: 28px;\n  }\n\n  .lockup .mark {\n    width: 56px;\n    height: 56px;\n    flex-shrink: 0;\n    object-fit: contain;\n  }\n\n  .lockup .wordmark {\n    font-family: var(--sans);\n    font-weight: 900;\n    font-size: 19px;\n    line-height: 1.1;\n    color: var(--black);\n    margin: 0;\n  }\n\n  .lockup .tagline {\n    font-family: var(--sans);\n    font-size: 12px;\n    font-weight: 400;\n    color: var(--ink-soft);\n    margin: 2px 0 0;\n  }\n\n  .eyebrow {\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--purple);\n    margin: 0 0 10px;\n  }\n\n  h1 {\n    font-family: var(--sans);\n    font-size: 42px;\n    line-height: 1.05;\n    margin: 0 0 12px;\n    color: var(--black);\n    font-weight: 900;\n  }\n\n  .subhead {\n    color: var(--ink-soft);\n    font-size: 16px;\n    line-height: 1.55;\n    max-width: 58ch;\n    margin: 0;\n  }\n\n  main {\n    max-width: 760px;\n    margin: 0 auto;\n    padding: 0 24px;\n  }\n\n  .panel {\n    background: var(--card);\n    border: 2px solid var(--black);\n    border-radius: var(--radius);\n    padding: 28px;\n    margin-top: 8px;\n  }\n\n  .mode-toggle {\n    display: inline-flex;\n    border: 2px solid var(--black);\n    border-radius: 999px;\n    overflow: hidden;\n    margin-bottom: 22px;\n  }\n\n  .mode-toggle button {\n    font-family: var(--sans);\n    font-size: 13px;\n    font-weight: 600;\n    letter-spacing: 0.02em;\n    padding: 8px 18px;\n    border: none;\n    background: transparent;\n    color: var(--black);\n    cursor: pointer;\n  }\n\n  .mode-toggle button.active {\n    background: var(--black);\n    color: #fff;\n  }\n\n  .field-row {\n    display: flex;\n    gap: 14px;\n    flex-wrap: wrap;\n  }\n\n  .field {\n    flex: 1;\n    min-width: 180px;\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n  }\n\n  label {\n    font-size: 12px;\n    font-weight: 600;\n    color: var(--ink-soft);\n    letter-spacing: 0.03em;\n  }\n\n  select, input[type=\"text\"] {\n    font-family: var(--sans);\n    font-size: 15px;\n    padding: 10px 12px;\n    border: 1.5px solid var(--black);\n    border-radius: var(--radius);\n    background: #fff;\n    color: var(--ink);\n  }\n\n  select:focus, input:focus, button:focus-visible {\n    outline: 2px solid var(--orange);\n    outline-offset: 1px;\n  }\n\n  .tables-toggle {\n    margin-top: 20px;\n  }\n\n  .tables-toggle summary {\n    font-size: 13px;\n    color: var(--purple);\n    cursor: pointer;\n    font-weight: 600;\n  }\n\n  .table-checks {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n    gap: 8px 16px;\n    margin-top: 12px;\n    font-size: 14px;\n  }\n\n  .table-checks label {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    font-weight: 400;\n    color: var(--ink);\n  }\n\n  .custom-table-row {\n    margin-top: 12px;\n    display: flex;\n    gap: 10px;\n    align-items: center;\n  }\n\n  .custom-table-row input {\n    flex: 1;\n  }\n\n  button.run {\n    margin-top: 22px;\n    font-family: var(--sans);\n    font-size: 15px;\n    font-weight: 700;\n    letter-spacing: 0.01em;\n    background: var(--black);\n    color: #fff;\n    border: 2px solid var(--black);\n    padding: 12px 22px;\n    border-radius: var(--radius);\n    cursor: pointer;\n  }\n\n  button.run:hover { background: var(--orange); border-color: var(--orange); }\n  button.run:disabled { background: #C9C7C2; border-color: #C9C7C2; cursor: wait; }\n\n  .status {\n    margin-top: 16px;\n    font-size: 14px;\n    font-family: var(--mono);\n    color: var(--ink-soft);\n  }\n\n  .status.error {\n    color: var(--error);\n  }\n\n  .stamp {\n    display: inline-flex;\n    align-items: center;\n    gap: 10px;\n    border: 2px solid var(--black);\n    color: var(--black);\n    background: var(--lime);\n    border-radius: 999px;\n    padding: 8px 18px;\n    font-family: var(--mono);\n    font-size: 13px;\n    letter-spacing: 0.04em;\n    margin: 30px 0 4px;\n  }\n\n  .stamp .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--black); }\n\n  .results {\n    margin-top: 4px;\n    display: flex;\n    flex-direction: column;\n    gap: 18px;\n  }\n\n  .card {\n    background: var(--card);\n    border: 2px solid var(--black);\n    border-left: 6px solid var(--blue);\n    border-radius: var(--radius);\n    padding: 20px 24px;\n  }\n\n  .card.civic { border-left-color: var(--purple); }\n\n  .idx-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));\n    gap: 10px;\n    margin-bottom: 4px;\n  }\n\n  .idx-tile {\n    background: #fff;\n    border: 1.5px solid var(--black);\n    border-top: 4px solid var(--purple);\n    border-radius: var(--radius);\n    padding: 10px 12px;\n  }\n\n  .idx-tile:nth-of-type(4n+2) { border-top-color: var(--orange); }\n  .idx-tile:nth-of-type(4n+3) { border-top-color: var(--blue); }\n  .idx-tile:nth-of-type(4n+4) { border-top-color: var(--lime); }\n\n  .idx-tile .idx-name {\n    font-size: 11px;\n    color: var(--ink-soft);\n    letter-spacing: 0.02em;\n    line-height: 1.3;\n    margin: 0 0 4px;\n  }\n\n  .idx-tile .idx-score {\n    font-family: var(--mono);\n    font-size: 22px;\n    font-weight: 700;\n    color: var(--black);\n  }\n\n  .idx-tile.overall { background: var(--black); border-top-color: var(--black); }\n  .idx-tile.overall .idx-name { color: rgba(255,255,255,0.75); }\n  .idx-tile.overall .idx-score { color: #fff; }\n\n  .metric-details { margin-top: 14px; }\n  .metric-details summary {\n    font-size: 12px;\n    color: var(--purple);\n    cursor: pointer;\n    font-weight: 600;\n  }\n  .metric-details .row { font-size: 13px; }\n\n  .card-note {\n    font-size: 13px;\n    color: var(--ink-soft);\n    font-style: italic;\n    margin: 0;\n  }\n\n  .onepager-section { margin-top: 28px; }\n\n  .btn-secondary {\n    font-family: var(--sans);\n    font-size: 14px;\n    font-weight: 700;\n    background: var(--purple);\n    color: #fff;\n    border: 2px solid var(--black);\n    padding: 11px 20px;\n    border-radius: var(--radius);\n    cursor: pointer;\n  }\n  .btn-secondary:hover { background: var(--orange); }\n\n  .onepager-card {\n    background: var(--card);\n    border: 2px solid var(--black);\n    border-radius: var(--radius);\n    padding: 20px 24px;\n    margin-top: 14px;\n  }\n\n  .onepager-card h3 {\n    font-family: var(--serif);\n    font-size: 18px;\n    margin: 0 0 12px;\n    color: var(--black);\n  }\n\n  .onepager-text {\n    white-space: pre-wrap;\n    font-family: var(--mono);\n    font-size: 12.5px;\n    line-height: 1.65;\n    color: var(--ink);\n    background: var(--paper);\n    border: 1.5px solid var(--black);\n    border-radius: var(--radius);\n    padding: 16px;\n    max-height: 520px;\n    overflow: auto;\n    margin: 0 0 12px;\n  }\n\n  .copy-btn {\n    font-family: var(--sans);\n    font-size: 12px;\n    font-weight: 600;\n    background: transparent;\n    color: var(--black);\n    border: 1.5px solid var(--black);\n    padding: 7px 14px;\n    border-radius: var(--radius);\n    cursor: pointer;\n  }\n  .copy-btn:hover { background: var(--black); color: #fff; }\n\n  .card h3 {\n    font-family: var(--serif);\n    font-size: 19px;\n    margin: 0 0 2px;\n    color: var(--black);\n  }\n\n  .card .table-id {\n    font-family: var(--mono);\n    font-size: 12px;\n    color: var(--ink-soft);\n    margin: 0 0 14px;\n  }\n\n  .row {\n    display: flex;\n    align-items: baseline;\n    gap: 8px;\n    padding: 5px 0;\n    border-bottom: 1px dotted var(--paper-line);\n    font-size: 14px;\n  }\n\n  .row:last-child { border-bottom: none; }\n\n  .row .name {\n    flex: 1;\n    color: var(--ink);\n  }\n\n  .row .val {\n    font-family: var(--mono);\n    font-weight: 600;\n    color: var(--black);\n    white-space: nowrap;\n  }\n\n  .row .moe {\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--ink-soft);\n    white-space: nowrap;\n  }\n\n  footer {\n    max-width: 760px;\n    margin: 40px auto 0;\n    padding: 0 24px;\n    font-size: 12px;\n    color: var(--ink-soft);\n    line-height: 1.6;\n  }\n\n  footer a { color: var(--purple); }\n  footer a:hover { color: var(--orange); }\n\n  @media (prefers-reduced-motion: reduce) {\n    * { transition: none !important; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<header>\n  <div class=\"lockup\">\n    <img class=\"mark\" src=\"6a0082b8-fadf-4947-b0bc-e52539f78107\" alt=\"Listening Post Collective mark\">\n    <div>\n      <p class=\"wordmark\">Listening Post Collective<\u002Fp>\n      <p class=\"tagline\">Powered by Internews<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"eyebrow\">Community Information / Field Data<\u002Fp>\n  <h1>Demographic Lookup<\u002Fh1>\n  <p class=\"subhead\">Pull American Community Survey data for a county or ZIP code.<\u002Fp>\n  <p class=\"subhead\" style=\"margin-top:14px;\">Once you've pulled data for a place, use \"Generate tips for Community Listening\" below to get a plan for running listening sessions there. Suggestions are grounded in the Civic Information Index and the Census figures you just pulled, plus general best practices for community engagement work.<\u002Fp>\n<\u002Fheader>\n\n<main>\n  <div class=\"panel\">\n    <div class=\"mode-toggle\" role=\"tablist\">\n      <button id=\"mode-county\" class=\"active\" role=\"tab\" aria-selected=\"true\">By county<\u002Fbutton>\n      <button id=\"mode-zip\" role=\"tab\" aria-selected=\"false\">By ZIP code<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div id=\"county-inputs\" class=\"field-row\">\n      <div class=\"field\">\n        <label for=\"state-select\">State<\u002Flabel>\n        <select id=\"state-select\"><\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"county-select\">County<\u002Flabel>\n        <select id=\"county-select\"><\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"zip-inputs\" class=\"field-row\" style=\"display:none;\">\n      <div class=\"field\">\n        <label for=\"zip-input\">ZIP code<\u002Flabel>\n        <input type=\"text\" id=\"zip-input\" placeholder=\"e.g. 41501\" maxlength=\"5\" inputmode=\"numeric\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"field-row\">\n      <div class=\"field\">\n        <label for=\"race-select\">Race / ethnicity (optional)<\u002Flabel>\n        <select id=\"race-select\"><\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <details class=\"tables-toggle\">\n      <summary>Choose what to pull (defaults selected)<\u002Fsummary>\n      <div class=\"table-checks\" id=\"table-checks\"><\u002Fdiv>\n      <div class=\"custom-table-row\">\n        <input type=\"text\" id=\"custom-table-id\" placeholder=\"Add another ACS table ID (e.g. B25003)\">\n      <\u002Fdiv>\n    <\u002Fdetails>\n\n    <button class=\"run\" id=\"run-btn\">Pull data<\u002Fbutton>\n    <div class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"stamp-holder\"><\u002Fdiv>\n  <div id=\"civic-holder\"><\u002Fdiv>\n  <div class=\"results\" id=\"results\"><\u002Fdiv>\n\n  <div class=\"onepager-section\" id=\"onepager-section\" style=\"display:none;\">\n    <button class=\"btn-secondary\" id=\"onepager-btn\">Generate tips for Community Listening<\u002Fbutton>\n    <div id=\"onepager-output\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n\n<footer>\n  Data from the U.S. Census Bureau's American Community Survey, retrieved live from the\n  <a href=\"https://censusreporter.org\" target=\"_blank\" rel=\"noopener\">Census Reporter<\u002Fa> API.\n  ZIP-level (ZCTA) estimates carry wider margins of error than county-level estimates because\n  of smaller sa turn zipCountyMapPromise;\n}\n\nfunction buildGeoid() {\n  if (mode === \"zip\") {\n    const z = zipInput.value.trim();\n    if (!/^\\d{5}$/.test(z)) throw new Error(\"Enter a 5-digit ZIP code.\");\n    return { geoid: `86000US${z}`, label: `ZIP ${z}`, countyFips: null, zip: z };\n  } else {\n    const stateFips = STATE_LIST.find(s => s[0] === stateSelect.value)[2];\n    const countyFips = countySelect.value;\n    const countyName = countySelect.options[countySelect.selectedIndex].textContent;\n    return {\n      geoid: `05000US${stateFips}${countyFips}`,\n      label: `${countyName}, ${stateSelect.value}`,\n      countyFips: `${stateFips}${countyFips}`,\n    };\n  }\n}\n\nfunction getSelectedTableIds() {\n  const ids = Array.from(tableChecks.querySelectorAll('input[data-role=\"table-check\"]:checked'))\n    .map(cb => cb.value);\n  const custom = customTableInput.value.trim().toUpperCase();\n  if (custom) ids.push(custom);\n  if (ids.length === 0) throw new Error(\"Select at least one table to pull.\");\n  return ids;\n}\n\nfunction getRaceSuffix() {\n  return raceSelect.value || \"\";\n}\n\nfunction renderStamp(label, geoid) {\n  stampHolder.innerHTML = \"\";\n  const stamp = document.createElement(\"div\");\n  stamp.className = \"stamp\";\n  stamp.innerHTML = `<span class=\"dot\"><\u002Fspan> ${label} &nbsp;·&nbsp; ${geoid}`;\n  stampHolder.appendChild(stamp);\n}\n\nfunction renderCivicIndex(countyFips, label, fromZip) {\n  civicHolder.innerHTML = \"\";\n  if (!countyFips) return; // civic data is county-level only; not available for ZIP lookups\n  const meta = window.CIVIC_INDEX_META;\n  const rec = window.CIVIC_INDEX_DATA && window.CIVIC_INDEX_DATA[countyFips];\n  if (!meta || !rec) return;\n\n  const [countyName, , population, ...rest] = rec;\n  const idxScores = rest.slice(0, meta.idxNames.length);\n  const metricVals = rest.slice(meta.idxNames.length);\n\n  const card = document.createElement(\"div\");\n  card.className = \"card civic\";\n\n  const h3 = document.createElement(\"h3\");\n  h3.textContent = \"Civic Information Index\";\n  card.appendChild(h3);\n\n  const idEl = document.createElement(\"p\");\n  idEl.className = \"table-id\";\n  idEl.textContent = fromZip\n    ? `Community Information / civic health data · ${countyName} (county containing ${label})`\n    : `Community Information / civic health data · ${label}`;\n  card.appendChild(idEl);\n\n  const noteEl = document.createElement(\"p\");\n  noteEl.style.cssText = \"font-size:12px;color:var(--ink-soft);margin:-8px 0 16px;\";\n  noteEl.textContent = fromZip\n    ? \"This index is county-level data. Your ZIP was mapped to its containing county — figures below describe the whole county, not the ZIP itself.\"\n    : \"This index is county-level data.\";\n  card.appendChild(noteEl);\n\n  const grid = document.createElement(\"div\");\n  grid.className = \"idx-grid\";\n  meta.idxNames.forEach((name, i) => {\n    const tile = document.createElement(\"div\");\n    tile.className = \"idx-tile\" + (name === \"Overall Index\" ? \" overall\" : \"\");\n    const n = document.createElement(\"p\");\n    n.className = \"idx-name\";\n    n.textContent = name;\n    const s = document.createElement(\"p\");\n    s.className = \"idx-score\";\n    const v = idxScores[i];\n    s.textContent = (v === null || v === undefined) ? \"—\" : v;\n    tile.appendChild(n);\n    tile.appendChild(s);\n    grid.appendChild(tile);\n  });\n  card.appendChild(grid);\n\n  const details = document.createElement(\"details\");\n  details.className = \"metric-details\";\n  const summary = document.createElement(\"summary\");\n  summary.textContent = \"Underlying metrics\";\n  details.appendChild(summary);\n  meta.metricNames.forEach((name, i) => {\n    const row = document.createElement(\"div\");\n    row.className = \"row\";\n    const n = document.createElement(\"span\");\n    n.className = \"name\";\n    n.textContent = name;\n    const v = document.createElement(\"span\");\n    v.className = \"val\";\n    const val = metricVals[i];\n    v.textContent = (val === null || val === undefined) ? \"—\" : Number(val).toLocaleString();\n    row.appendChild(n);\n    row.appendChild(v);\n    details.appendChild(row);\n  });\n  card.appendChild(details);\n\n  civicHolder.appendChild(card);\n}\n\nfunction renderTableCard(tableId, raceSuffix, raceLabel, result) {\n  const card = document.createElement(\"div\");\n  card.className = \"card\";\n\n  const h3 = document.createElement(\"h3\");\n  const baseTitle = (result && result.title) || tableId;\n  h3.textContent = raceSuffix ? `${baseTitle} — ${raceLabel}` : baseTitle;\n  card.appendChild(h3);\n\n  const idEl = document.createElement(\"p\");\n  idEl.className = \"table-id\";\n  idEl.textContent = tableId + raceSuffix;\n  card.appendChild(idEl);\n\n  if (result.error) {\n    const note = document.createElement(\"p\");\n    note.className = \"card-note\";\n    note.textContent = raceSuffix\n      ? `No data for ${tableId}${raceSuffix}. This table may not break out by race/ethnicity — not every ACS detailed table has that iteration.`\n      : `No data returned for ${tableId}. It may be too small for this geography, or not covered by the latest ACS release.`;\n    card.appendChild(note);\n    resultsEl.appendChild(card);\n    return;\n  }\n\n  Object.entries(result.columns)\n    .filter(([, col]) => (col.indent ?? 0) <= 1)\n    .forEach(([colId, col]) => {\n      const row = document.createElement(\"div\");\n      row.className = \"row\";\n      const name = document.createElement(\"span\");\n      name.className = \"name\";\n      name.textContent = col.name || colId;\n      const val = document.createElement(\"span\");\n      val.className = \"val\";\n      const est = result.estimates[colId];\n      val.textContent = (est === undefined || est === null) ? \"—\" : Number(est).toLocaleString();\n      const moe = document.createElement(\"span\");\n      moe.className = \"moe\";\n      const err = result.errors[colId];\n      moe.textContent = (err === undefined || err === null) ? \"\" : `±${Number(err).toLocaleString()}`;\n      row.appendChild(name);\n      row.appendChild(val);\n      row.appendChild(moe);\n      card.appendChild(row);\n    });\n\n  resultsEl.appendChild(card);\n}\n\nasync function fetchTable(tableId, raceSuffix, geoid) {\n  const fullId = tableId + raceSuffix;\n  const url = `${CENSUS_API}?table_ids=${encodeURIComponent(fullId)}&geo_ids=${encodeURIComponent(geoid)}`;\n  const resp = await fetch(url);\n  if (!resp.ok) return { error: true };\n  const json = await resp.json();\n  const data = json.data && json.data[geoid] && json.data[geoid][fullId];\n  const meta = json.tables && json.tables[fullId];\n  if (!data || !meta) return { error: true };\n  return {\n    error: false,\n    title: meta.title,\n    columns: meta.columns || {},\n    estimates: data.estimate || {},\n    errors: data.error || {},\n  };\n}\n\nasync function runQuery() {\n  statusEl.className = \"status\";\n  statusEl.textContent = \"\";\n  resultsEl.innerHTML = \"\";\n  stampHolder.innerHTML = \"\";\n  civicHolder.innerHTML = \"\";\n  onepagerSection.style.display = \"none\";\n  onepagerOutput.innerHTML = \"\";\n  lastPull = null;\n\n  let geoid, label, countyFips, zip, tableIds, countyFipsFromZip = false;\n  try {\n    ({ geoid, label, countyFips, zip } = buildGeoid());\n    if (zip) {\n      const zipMap = await getZipCountyMap();\n      if (zipMap && zipMap[zip]) {\n        countyFips = zipMap[zip];\n        countyFipsFromZip = true;\n      }\n    }\n    tableIds = getSelectedTableIds();\n  } catch (err) {\n    statusEl.className = \"status error\";\n    statusEl.textContent = err.message;\n    return;\n  }\n\n  const raceSuffix = getRaceSuffix();\n  const raceLabel = raceSuffix ? RACE_OPTIONS.find(r => r[0] === raceSuffix)[1] : \"\";\n\n  runBtn.disabled = true;\n  statusEl.textContent = `Pulling ${tableIds.join(\", \")}${raceSuffix ? ` (${raceLabel})` : \"\"} for ${label}…`;\n\n  try {\n    const results = await Promise.all(tableIds.map(id => fetchTable(id, raceSuffix, geoid).catch(() => ({ error: true }))));\n    if (results.every(r => r.error)) {\n      throw new Error(\"No data returned for this geography. It may be too small for these tables, or not covered by the latest ACS release.\");\n    }\n    statusEl.textContent = \"\";\n    renderStamp(label, geoid);\n    renderCivicIndex(countyFips, label, countyFipsFromZip);\n    tableIds.forEach((id, i) => renderTableCard(id, raceSuffix, raceLabel, results[i]));\n\n    lastPull = { label, geoid, countyFips, countyFipsFromZip, raceSuffix, raceLabel, tableResults: tableIds.map((id, i) => ({ id, result: results[i] })) };\n    onepagerSection.style.display = \"block\";\n  } catch (err) {\n    statusEl.className = \"status error\";\n    if (err instanceof TypeError) {\n      statusEl.textContent = \"Couldn't reach the Census Reporter API from this browser (network or cross-origin restriction). Try again, or open this file from a regular web server instead of double-clicking it directly.\";\n    } else {\n      statusEl.textContent = err.message;\n    }\n  } finally {\n    runBtn.disabled = false;\n  }\n}\n\nconst LISTENING_BEST_PRACTICES = [\n  \"Go to where people already gather (churches, schools, laundromats, markets) instead of asking them to come to a new venue.\",\n  \"Offer more than one way to participate — in person, by phone, and on paper — so the format doesn't screen out whole groups.\",\n  \"Recruit and brief trusted local messengers to help convene sessions; a familiar face lowers the barrier to showing up and speaking freely.\",\n  \"Compensate people for their time when you can, even modestly, and provide food, childcare, or transit help for in-person sessions.\",\n  \"Be upfront about what the input will be used for and follow up with participants on what happened with what they said.\",\n  \"Keep sessions small enough for real conversation, and schedule more than one so shift workers and caregivers can attend.\",\n];\n\nfunction fmtNum(v, digits) {\n  if (v === null || v === undefined || isNaN(v)) return null;\n  return digits ? Number(v).toFixed(digits) : Number(v).toLocaleString();\n}\n\nfunction buildTailoredNotes(countyFips) {\n  const meta = window.CIVIC_INDEX_META;\n  const rec = countyFips && window.CIVIC_INDEX_DATA && window.CIVIC_INDEX_DATA[countyFips];\n  if (!meta || !rec) {\n    return [\"Civic Information Index data isn't available for this geography (county-level only), so these notes rely on general best practice alone.\"];\n  }\n  const idxCount = meta.idxNames.length;\n  const metricVals = rec.slice(3 + idxCount);\n  const m = {};\n  meta.metricNames.forEach((name, i) => { m[name] = metricVals[i]; });\n\n  const notes = [];\n  const add = (cond, text) => { if (cond) notes.push(text); };\n\n  const broadband = m[\"Percent of households with broadband\"];\n  add(broadband !== null && broadband < 80, `Broadband reaches about ${fmtNum(broadband)}% of households here — don't rely on an online-only survey or virtual session; pair it with phone calls, mail, or door-knocking.`);\n\n  const otherLang = m[\"Percent who speak a language other than English at home\"];\n  add(otherLang !== null && otherLang > 10, `About ${fmtNum(otherLang)}% of residents speak a language other than English at home — plan for translated materials and interpretation at sessions, not just English-language outreach. If no one on your team speaks the relevant language(s), connect with local community leaders or organizations who do and ask for their support reaching and interpreting for those residents, particularly when working with migrant communities. Pull the \"Language Spoken at Home\" table above for the specific languages present here.`);\n\n  const noVehicle = m[\"Percent with no vehicle available\"];\n  add(noVehicle !== null && noVehicle > 8, `${fmtNum(noVehicle)}% of households have no vehicle available — hold sessions somewhere walkable or transit-accessible, or bring the session to existing gathering spots.`);\n\n  const uninsured = m[\"Percent uninsured\"];\n  add(uninsured !== null && uninsured > 12, `${fmtNum(uninsured)}% of residents are uninsured, a sign of financial strain that can also affect trust in institutional outreach — be transparent about who's asking and why.`);\n\n  const highPoverty = m[\"Percent in high poverty neighborhoods\"];\n  add(highPoverty !== null && highPoverty > 15, `${fmtNum(highPoverty)}% of residents live in high-poverty neighborhoods — compensate participants for their time where possible, and avoid daytime-only scheduling that excludes people working multiple jobs.`);\n\n  const turnout = m[\"Voter turnout (percent)\"];\n  add(turnout !== null && turnout < 55, `Voter turnout runs about ${fmtNum(turnout)}% here, suggesting lower engagement with formal civic channels — lead with relationship-building and trusted messengers rather than an institutional frame.`);\n\n  const socialAssoc = m[\"Social associations per 10,000 population\"];\n  const volunteerRate = m[\"Volunteer rate (percent)\"];\n  add((socialAssoc !== null && socialAssoc < 8) || (volunteerRate !== null && volunteerRate < 20), `Existing associational infrastructure (civic groups, volunteer rate) looks thin here — partner with schools, faith institutions, or informal networks rather than expecting people to come to a new meeting.`);\n\n  const responseRate = m[\"Census response rate (percent)\"];\n  add(responseRate !== null && responseRate < 65, `Census self-response ran about ${fmtNum(responseRate)}% — that can reflect distrust of official data collection, so be explicit and concrete about how the information you gather will be used.`);\n\n  const heatDays = m[\"Heat wave days\"];\n  add(heatDays !== null && heatDays > 20, `This area sees a notable number of heat wave days (${fmtNum(heatDays, 0)}) — avoid scheduling outdoor sessions during peak heat, and check that indoor venues have reliable cooling.`);\n\n  const news = m[\"Total news outlets\"];\n  add(news !== null && news < 2, `Very few local news outlets serve this area (${fmtNum(news, 0)}) — don't count on a press release to spread word of a listening session; use direct, relational outreach instead.`);\n\n  if (notes.length === 0) {\n    notes.push(\"No major outreach barriers stand out in the Civic Index data for this place — general best practice below should carry most of the planning.\");\n  }\n  return notes;\n}\n\nfunction buildDataSummaryLines(pull) {\n  const lines = [];\n  pull.tableResults.forEach(({ id, result }) => {\n    if (result.error) return;\n    const topCols = Object.entries(result.columns).filter(([, col]) => (col.indent ?? 0) === 0);\n    topCols.forEach(([colId, col]) => {\n      const est = result.estimates[colId];\n      if (est === undefined || est === null) return;\n      lines.push(`- ${col.name || colId} (${id}): ${Number(est).toLocaleString()}`);\n    });\n  });\n  return lines;\n}\n\nfunction generateOnePager() {\n  if (!lastPull) return;\n  const p = lastPull;\n  const meta = window.CIVIC_INDEX_META;\n  const rec = p.countyFips && window.CIVIC_INDEX_DATA && window.CIVIC_INDEX_DATA[p.countyFips];\n\n  const lines = [];\n  lines.push(`COMMUNITY LISTENING ONE-PAGER`);\n  lines.push(`${p.label}${p.raceSuffix ? ` — data filtered to: ${p.raceLabel}` : \"\"}`);\n  lines.push(\"\");\n\n  lines.push(\"WHAT THE DATA SHOWS\");\n  if (rec) {\n    if (p.countyFipsFromZip) {\n      const countyName = rec[0];\n      lines.push(`(Civic Information Index is county-level data. ${p.label} was mapped to its containing county, ${countyName}, for these figures.)`);\n    }\n    const idxCount = meta.idxNames.length;\n    const idxScores = rec.slice(3, 3 + idxCount);\n    meta.idxNames.forEach((name, i) => {\n      const v = idxScores[i];\n      if (v !== null && v !== undefined) lines.push(`- ${name}: ${v} / 100`);\n    });\n  } else {\n    lines.push(\"- Civic Information Index not available for this geography (county-level only).\");\n  }\n  const dataLines = buildDataSummaryLines(p);\n  if (dataLines.length) {\n    lines.push(\"\");\n    dataLines.forEach(l => lines.push(l));\n  }\n  lines.push(\"\");\n\n  lines.push(\"WHAT THIS SUGGESTS FOR OUTREACH HERE\");\n  buildTailoredNotes(p.countyFips).forEach(n => lines.push(`- ${n}`));\n  lines.push(\"\");\n\n  lines.push(\"GENERAL GUIDANCE FOR COMMUNITY LISTENING\");\n  LISTENING_BEST_PRACTICES.forEach(n => lines.push(`- ${n}`));\n  lines.push(\"\");\n  lines.push(\"Data: U.S. Census Bureau American Community Survey (via Census Reporter) and the Civic Information Index, 2026.\");\n\n  return lines.join(\"\\n\");\n}\n\nonepagerBtn.addEventListener(\"click\", () => {\n  const text = generateOnePager();\n  if (!text) return;\n  onepagerOutput.innerHTML = \"\";\n  const card = document.createElement(\"div\");\n  card.className = \"onepager-card\";\n  const h3 = document.createElement(\"h3\");\n  h3.textContent = \"Community listening one-pager\";\n  const pre = document.createElement(\"pre\");\n  pre.className = \"onepager-text\";\n  pre.textContent = text;\n  const copyBtn = document.createElement(\"button\");\n  copyBtn.className = \"copy-btn\";\n  copyBtn.textContent = \"Copy to clipboard\";\n  copyBtn.addEventListener(\"click\", () => {\n    navigator.clipboard.writeText(text).then(() => {\n      copyBtn.textContent = \"Copied!\";\n      setTimeout(() => { copyBtn.textContent = \"Copy to clipboard\"; }, 1500);\n    });\n  });\n  card.appendChild(h3);\n  card.appendChild(pre);\n  card.appendChild(copyBtn);\n  onepagerOutput.appendChild(card);\n});\n\nrunBtn.addEventListener(\"click\", runQuery);\n\npopulateStates();\npopulateTableChecks();\npopulateRaceSelect();\nsetMode(\"county\");\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
